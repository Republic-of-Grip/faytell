<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No window — Faytell</title>
  <meta name="description" content="This Faytell address does not hold a page.">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090b'/%3E%3Crect x='3.5' y='3.5' width='25' height='25' fill='none' stroke='%23c9c4ba' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='6.2' fill='none' stroke='%23c9c4ba' stroke-width='1.15'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #08090b;
      color: #e6e2da;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .frame {
      min-height: calc(100vh - 28px);
      margin: 14px;
      border: 1px solid rgba(214, 210, 200, 0.34);
      display: flex;
      flex-direction: column;
    }
    .bar, .foot {
      display: flex;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8d939c;
    }
    .bar { border-bottom: 1px solid rgba(214, 210, 200, 0.16); }
    .foot { border-top: 1px solid rgba(214, 210, 200, 0.16); margin-top: auto; }
    .mark {
      font-family: Palatino, Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.01em;
      text-transform: none;
      color: #e6e2da;
      text-decoration: none;
    }
    main {
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4.5rem 0 5rem;
    }
    .kicker {
      margin: 0 0 1.25rem;
      color: #8d939c;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Palatino, Georgia, serif;
      font-weight: 400;
      font-size: clamp(3rem, 8vw, 4.6rem);
      line-height: 0.92;
    }
    p { margin: 1.5rem 0 0; max-width: 36rem; font-size: 1.15rem; }
    a { color: inherit; }
    @media (max-width: 640px) {
      .frame { margin: 8px; }
      main { padding: 3rem 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="bar">
      <a class="mark" id="home" href="/faytell/">Faytell</a>
      <span>Missing</span>
    </header>
    <main>      <h1>Nothing was summoned here.</h1>
      <p>This address does not hold a page. If you were given a link, it is not this one.</p>
    </main>
    <footer class="foot">
      <span>Faytell</span>
      <a id="return" href="/faytell/">Return</a>
    </footer>
  </div>
</body>
